- insert:
    - id: fleet-feishu
      name: 'dsh-fleet-feishu'
      config:
        # ===== 必填三项：按自己的机器改 =====
        # device_name  群里署名，如「小鲸鱼-办公机」
        # chat_id      群 ID（oc_ 开头）
        # bot_open_id  本 bot 在【本应用视角】下的 open_id（ou_ 开头）
        device_name: agent
        chat_id: ''
        bot_open_id: ''
        # ===== 可选（有默认值，按需覆盖）=====
        task_timeout_sec: 300
        max_reply_chars: 3500
        task_max_depth: 3
        receipt_window_min: 45
        roster_interval_min: 60
        send_identity: bot
        reply_identity: bot
        reply_reject: true
        session_id: ''
        headless_profile: ''
        headless_env_file: ''
        headless_workspace: ''
        lark_entry: ''
        dsh_entry: ''
